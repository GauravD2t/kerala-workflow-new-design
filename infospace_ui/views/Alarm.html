{% extends 'layout/layout.html' %}
{% block title %}{% endblock %}
{% block content %}
<link rel="stylesheet" type="text/css" href="./template/assets/css/patson/toastr.css">
<div class="main">
    <div class="main-inner">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="widget ">
                        <div class="widget-header">
                            <i class="icon-user"></i>
                            <h3>Alarm view</h3>
                            <select class="search-query form-control" id="deviceList" style="float:right;height: 100%">
                                <option value>select Project</option>
                                {% for x in projects %}
                                <option value="{{x.id}}">{{x.projectname}}</option>
                                {% endfor %}                    
                            </select>
                        </div> <!-- /widget-header -->
                        <div class="widget-content">                        
                                <form class="form-horizontal" action="/savePlc.patson" method="post">
                                    <div class="row">
                                        <div class="col-lg-12">
                                               <div class="form-group">                        
                                                <div class="col-lg-2 col-md-2 col-sm-2">
                                                    <label class="control-label" for="firstname"><strong>Start Date</strong></label>
                                                </div>                                                
                                                <div class="col-lg-3 col-md-3 col-sm-3" style="width: 19.5%;">
                                                    <input class="form-control"data-date-format="dd/mm/yyyy HH:mm" id="startdate" type="text">
                                                </div>
                                                
                                                <div class="col-lg-2 col-md-2 col-sm-2">
                                                        <label class="control-label" for="firstname"><strong>End Date</strong></label>
                                                    </div>    
                                                <div class="col-lg-3 col-md-3 col-sm-3" style="width: 19.5%;">
                                                    <input class="form-control" data-date-format="dd/mm/yyyy HH:mm" id="enddate" type="text">
                                                </div>
                                                <div class="col-lg-1 col-md-1 col-sm-1">
                                                    <button  type="button" class="searchevent btn btn-primary" isDownload="false">Submit</button>
                                                </div>
                                                <div class="col-lg-1 col-md-1 col-sm-1">
                                                    <button type="button" class="Downloadevent btn btn-primary" isDownload="true">Download</button>
                                                </div>
                                                <div class="col-lg-1 col-md-1 col-sm-1">   
                                                    &nbsp;&nbsp;                                                 
                                                    <a class="refresh" href="#">                                                        
                                                        <i class="icon-large icon-refresh" style="font-size:22px;color:#3366cc;"></i>                                                        
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>                                    
                                </form>
                        </div>
                        <div class="widget-content">                       
                                <div class="row" style="margin-left: 3%;">
                                    <div class="col-lg-12">
                                        <div class="form-group">
                                            <table id="tagListHistory" class=" table table-striped table-bordered">
                                                    <thead>
                                                            <tr>
                                                                <th scope="col">ID</th>
                                                                <th scope="col">Event Time </th>
                                                                <th scope="col">Tage Name </th>
                                                                <th scope="col">Current Value </th>   
                                                                <th scope="col">limevalue Value </th>   
                                                                <th scope="col">Description</th>   
                                                                <th scope="col">Confirm</th>   
                                                                <th scope="col">Current zone</th>   
                                                                <th scope="col">Operator Name</th>                                       
                                                                <th scope="col"> Date</th>
                                                            </tr>
                                                        </thead>
                                                <tbody>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="./template/assets/js/patson//toastr.min.js"></script>
<script src="./template/assets/js/MQTTJS/Alarm.js"></script>
{% endblock %}
