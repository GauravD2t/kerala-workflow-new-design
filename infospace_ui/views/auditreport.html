{% extends 'layout/layout.html' %}
{% block title %}{% endblock %}
{% block content %}
<div class=" container ">
    <style>
        .apexcharts-legend {
            display: none;
        }
    </style>
    <link href="./template/assets/plugins/custom/datatables/datatables.bundle.css" rel="stylesheet" type="text/css" />
    <div class="row ">
        <div class="col-lg-12 bg-white  rounded-bottom-0" style="border-bottom: 1px solid #EBEDF3;">
            <div class=" card-custom card-stretch gutter-b">
                <h4 class=" py-2 px-2 ">
                    <span class="font-weight-bolder text-dark">Filter</span>
                </h4>
                <div class="row containbatch">
                    <div class="col-lg-6 py-2">
                        <div class=" row">
                            <div class="col-lg-2 col-md-9 col-sm-12"><label
                                    class="col-form-label text-left col-lg-1 col-sm-12">Date</label></div>
                            <div class="col-lg-10 col-md-9 col-sm-12">
                                <div class="input-daterange input-group" id="kt_datepicker_5">
                                    <input type="text" class="form-control" name="start" id="start" />
                                    <div class="input-group-append">
                                        <span class="input-group-text">To</span>
                                    </div>
                                    <input type="text" class="form-control" name="end" id="end" />
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 py-2">
                        <select id="filter" class="form-control">
                            <option value="0">Scaning</option>
                            <option value="1">ScanQc</option>
                            <option value="6">Data Entry</option>
                            <option value="2">Classfication</option>
                            <option value="7">PDF Generation</option>
                            <option value="8">IM Verication</option>
                            <option value="3">L1 Verify</option>
                            <option value="4">L1 Customer Reject</option>
                            <option value="9">L2  Verify</option>
                            <option value="10">L2 Customer Reject</option>
                            <option value="11">L3 Verify</option>
                            <option value="12">L3 Customer Reject</option>
                            <option value="5">Uploaded File</option>
                        </select>
                    </div>
                    <div class="col-lg-6 py-2">
                        <input type="button" id="commitBatchButton" name="commitBatchButton" style="width: 115px;"
                            class="form-control btn btn-primary font-weight-bolder mr-2" tabindex="8" value="Apply"
                            onclick="showdata()" />
                        <!-- <input type="button" id="reset" name="reset" style="width: 115px;"
                            class="form-control btn btn-light-primary font-weight-bolder mr-2" tabindex="8"
                            value="Reset" onclick="resetdata()" /> -->
                        <input type="button" id="downloadexlcle" name="downloadexlcle" style="width: 125px;"
                            class="form-control btn btn-success font-weight-bolder mr-2" tabindex="8"
                            value="Download excel" onclick="downloadExcle()" />

                        <input type="button" id="downloadexlcleuser" name="downloadexlcleuser" style="width: 200px;"
                            class="form-control btn btn-success font-weight-bolder mr-2" tabindex="8"
                            value="User Wise Download excel " onclick="downloadUserwiseDate()" />
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-12 py-2 bg-secondary"></div>


    </div>
    <div class="row ">
        <div class="col-lg-12 bg-white rounded rounded-bottom-0" style="border-bottom: 1px solid #EBEDF3;">
            <div class="">
                <h4 class=" py-2 px-2 ">
                    <div class="font-weight-bolder text-dark">File Summary </div>

                </h4>
                <div class="card-body ">
                    <div class="col-lg-12">
                        <div class="row mb-3 align-items-center">
                            <div class="col-lg-12 col-xl-8">
                                <div class="row align-items-center">
                                    <div class="col-md-12 my-2 my-md-0">
                                        <div class="input-icon">
                                            <input type="text" class="form-control" placeholder="Search..."
                                                id="kt_datatable_search_query" />
                                            <span><i class="flaticon2-search-1 text-muted"></i></span>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="table-bordered table-striped datatable datatable-bordered " id="kt_datatable"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-12 py-2 bg-secondary"></div>


    </div>


</div>
<script src="./template/assets/plugins/custom/flot/flot.bundle.js"></script>
<script src="./template/assets/plugins/custom/datatables/datatables.bundle.js"></script>
<script src="./template/assets/js/ccntsJS/common.js"></script>
<script src="./template/assets/js/ccntsJS/auditreport.js"></script>
{% endblock %}
