{% extends 'layout/layout.html' %}
{% block title %}{% endblock %}
{% block content %}
<div class=" container ">

    <div class="row">
        <div class="col-lg-12">
            <div class="card card-custom card-stretch gutter-b">
                <div class="card-header">
                    <h3 class="card-title">
                        Estimated Volume
                    </h3>

                </div>
                <!--begin::Form-->
                <form class="form fv-plugins-bootstrap fv-plugins-framework" novalidate="novalidate" id="estimateForm">
                    <div class="card-body">

                        <div class="form-group row">
                            <div class="col-lg-2">
                                <label> Year <span class="text-danger">*</span></label>
                                <input type="text" name="year" id="year"
                                    class="validatefir bg-secondary numberOnly  year form-control" maxlength="4"
                                    placeholder="" tabindex="1" />

                            </div>
                            <div class="col-lg-2">
                                <label> IFF 1 <span class="text-danger"></span></label>
                                <input type="text" name="iif1" id="iif1" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-lg-2">
                                <label> IFF 2 <span class="text-danger"></span></label>
                                <input type="text" name="iif2" id="iif2" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-lg-2">
                                <label> IFF 3 <span class="text-danger"></span></label>
                                <input type="text" name="iif3" id="iif3" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-lg-2">
                                <label> IFF 4 <span class="text-danger"></span></label>
                                <input type="text" name="iif4" id="iif4" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>

                        </div>
                        <div class="form-group row">
                            <div class="col-lg-2">
                                <label> IFF 5 <span class="text-danger"></span></label>
                                <input type="text" name="iif5" id="iif5" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-lg-2">
                                <label> IFF 6 <span class="text-danger"></span></label>
                                <input type="text" name="iif6" id="iif6" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-lg-2">
                                <label> IFF 7 <span class="text-danger"></span></label>
                                <input type="text" name="iif7" id="iif7" class=" bg-secondary numberOnly   form-control"
                                    placeholder="" tabindex="1" />
                            </div>
                            <div class="col-sm-1 py-8">
                                <input type="button" id="addmenu" name="submitButton"
                                    class="savebtn btn btn-primary mr-2" tabindex="1" value="Submit"
                                    onclick="sumbitEstimate()"></button>
                            </div>
                            <div class="col-sm-1 py-8">
                                <input type="button" class="btn btn-primary mr-2" tabindex="1" id="resetform"
                                    value="Reset" onclick="resetData()"></button>
                            </div>
                        </div>

                    </div>

                </form>
                <!--end::Form-->
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-lg-12">
            <div class="card card-custom card-stretch gutter-b">
                <div class="card-header">
                    <h3 class="card-title">
                        Yearwise Estimated Volume
                    </h3>

                </div>
                <div class="card-body">
                    <div class="mb-7">
                        <div class="row align-items-center">
                            <div class="col-lg-9 col-xl-8">
                                <div class="row align-items-center">
                                    <div class="col-md-4 my-2 my-md-0">
                                        <div class="input-icon">
                                            <input type="text" class="form-control" placeholder="Search..."
                                                id="kt_datatable_search_query" />
                                            <span><i class="flaticon2-search-1 text-muted"></i></span>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                    <div id="kt_datatable"
                        class="table-bordered datatable  datatable-bordered datatable-head-custom table-hover"></div>
                </div>
            </div>
        </div>

    </div>
    <!-- delete Modal-->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Delete Estimate Volume</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <i aria-hidden="true" class="ki ki-close"></i>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure want to Delete <strong id="ModalValue"></strong>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light-primary font-weight-bold"
                        data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger font-weight-bold" data-dismiss="modal"
                        onclick="deletemenu()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./template/assets/js/ccntsJS/common.js"></script>
<script src="./template/assets/js/ccntsJS/digiestimate.js"></script>
{% endblock %}
