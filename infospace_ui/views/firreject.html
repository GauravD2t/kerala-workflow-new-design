{% extends 'layout/layout.html' %}
{% block title %}{% endblock %}
{% block content %}
<div class=" container ">
    <style>
        .apexcharts-legend{
            display: none;
        }
        .table td {
            border-top: 1px solid #868c9c;
        }
        .table thead th {
            border-bottom: 1px solid #151925;
            color:#525db1;
        }
    </style>
    <link href="./template/assets/plugins/custom/datatables/datatables.bundle.css" rel="stylesheet" type="text/css"/>
    <div class="row ">
        <div class="col-lg-4 bg-white  rounded-bottom-0" style="border-bottom: 1px solid #EBEDF3;">
            <div class=" card-custom card-stretch gutter-b">
                <h4 class=" py-2 px-2 ">
                    <span class="font-weight-bolder text-dark">Filter</span>
                </h4>
                <div class="row containbatch">
                   
                    
                    <div class="col-lg-12 py-2">
                        <select  class="form-control" name="filter3" id="filter3" tabindex="1" multiple >
                            <option value>Select Police Station</option>
                            {%for x in policestations%}
                            <option value="{{x.ps_cd}}">{{x.ps}}</option>
                            {%endfor%}
                        </select>
                    </div>
                                     
                    <div class="col-lg-12 py-2">
                    <input type="button" id="commitBatchButton" name="commitBatchButton" style="width: 115px;"
                                class="form-control btn btn-light-primary font-weight-bolder mr-2" tabindex="8"
                                value="Apply" onclick="getFIRreject()" />
                    <input type="button" id="reset" name="reset" style="width: 115px;"
                    class="form-control btn btn-light-primary font-weight-bolder mr-2" tabindex="8"
                    value="Reset" onclick="resetdata()" />
                    </div>            
                </div>
            </div>
        </div>
        <div class="col-lg-8 bg-white  rounded-bottom-0" style="border-bottom: 1px solid #EBEDF3;">
            

        </div>
        <div class="col-lg-12 py-2 bg-secondary"></div>
        

    </div>
    <div class="row ">
        <div class="col-lg-12 bg-white rounded rounded-bottom-0" style="border-bottom: 1px solid #EBEDF3;">
            <div class="">
                <h4 class=" py-2 px-2 ">
                    <div class="font-weight-bolder text-dark">FIR Reject List </div>
                   
                </h4>
                <div class="row ">
                    <table class="table" id="worktable" >
                        <thead>
                            <tr>
                              <th>FIR REG NO</th>
                              <th>Reject by</th>
                              <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>          
                </div>
            </div>
        </div>
        
        <div class="col-lg-12 py-2 bg-secondary"></div>
        

    </div>
    
    
</div>
<script src="./template/assets/plugins/custom/flot/flot.bundle.js"></script>
<script src="./template/assets/plugins/custom/datatables/datatables.bundle.js"></script>
<script src="./template/assets/js/ccntsJS/common.js"></script>
<script src="./template/assets/js/ccntsJS/firreject.js"></script>
{% endblock %}
