{% extends 'layout/layout.html' %}
{% block title %}{% endblock %}
{% block content %}
<div class=" container ">
    <div class="row">
        <div class="col-lg-12">
            <div class="card card-custom card-stretch gutter-b">
                <div class="card-header">
                    <h3 class="card-title">
                        Menu 
                    </h3>
                
                </div>
                <!--begin::Form-->
                <form class="form fv-plugins-bootstrap fv-plugins-framework" novalidate="novalidate" id="menuForm">
                    <div class="card-body">                        
                        <div class="form-group row">                            
                            <div class="col-lg-4">
                                <label> Role <span class="text-danger">*</span></label>
                                <select class="form-control" name="role" id="role" tabindex="2">
                                <option value="-1">Select Role</option>
                                    {% for x in roles %}
                                    <option value="{{x.id}}">{{x.name}}</option>
                                    {% endfor %}
                                </select>
                            </div>                            
                            <div class="col-lg-8">
                                <select id="menulist" class="dual-listbox" 
                                    data-available-title="Source Menus" data-selected-title="Destination Menus"
                                    data-add="<i class='flaticon2-next'></i>"
                                    data-remove="<i class='flaticon2-back'></i>"
                                    data-add-all="<i class='flaticon2-fast-next'></i>"
                                    data-remove-all="<i class='flaticon2-fast-back'></i>">
                                    {% for x in menus %}
                                        <option value="{{x.id}}">{{x.menuname}}</option>
                                    {% endfor %}
                                </select>
                            </div>                        
                            
                        </div>
                        <div class="form-group row"> 
                            <div class="col-sm-1 py-8">
                                <input type="button" id="addmenu" name="submitButton" class="savebtn btn btn-primary mr-2" tabindex="3" value="Submit" onclick="sumbitMenu()"></button>
                            </div> 
                            <div class="col-sm-1 py-8">
                                <input type="button" class="btn btn-primary mr-2" tabindex="4" id="resetform" value="Reset" onclick="resetData()"></button>
                            </div> 
                         </div>
                        
                    </div>
                    
                </form>
                <!--end::Form-->
            </div>
        </div>
    
    </div>    
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Delete</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <i aria-hidden="true" class="ki ki-close"></i>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure want to Delete <strong id="ModalValue"></strong>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light-primary font-weight-bold" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger font-weight-bold" data-dismiss="modal" onclick="deletemenu()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="./template/assets/js/ccntsJS/role.js"></script>
{% endblock %}
